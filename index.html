<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下注后台统计</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    transform: scale(0.55);
    transform-origin: top center;
}
.number-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    justify-content: center;
    max-width: 520px;
    margin: auto;
}
.number-box {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.number {
    width: 50px;
    height: 50px;
    line-height: 50px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    border-radius: 50%;
    color: white;
}
.red { background-color: red; }
.blue { background-color: blue; }
.green { background-color: green; }
.amount, .profit {
    width: 68px;
    text-align: center;
    margin-top: 5px;
    font-size: 14px;
    font-weight: bold;
    overflow: visible;
    border: none;
    background: none;
}
.negative { color: red; }
.zodiac {
    font-size: 14px;
    color: #666;
    margin-top: 3px;
}
.board-title {
    margin-top: 20px;
    margin-bottom: 10px;
}
#totalBetDisplay::before{content:'普通盘 · ';font-weight:bold}
#hkTotalBetDisplay::before{content:'香港盘 · ';font-weight:bold}

#historyBox {
    max-width: 900px;
    margin: 24px auto;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px 14px;
    background: #fff;
    text-align: left;
    font-size: 14px;
    line-height: 1.55;
    height: 850px;
    max-height: none;
    overflow-y: auto;
}
.history-title {
    font-weight: bold;
    font-size: 16px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}
.history-tools input,.history-tools button {
    font-size:13px;
    padding:5px 8px;
}
.history-item {
    padding: 8px 0;
    border-bottom: 1px dashed #ddd;
    word-break: break-all;
}
.history-item:last-child {border-bottom:none}
.history-time {color:#777}
.history-detail {color:#333}
.history-undone {color:#d60000}
#syncStatus {font-size:13px;color:#666;margin:8px auto;max-width:760px}
</style>
</head>
<body>

<div id="syncStatus">正在读取所有手机数据...</div>

<h3 id="totalBetDisplay" style="margin-top:15px;">下注总数: 0</h3>
<div class="number-grid" id="numbers"></div>

<h3 id="hkTotalBetDisplay" class="board-title">香港下注总数: 0</h3>
<div class="number-grid" id="hkNumbers"></div>

<div id="historyBox">
  <div class="history-title">
    <span>下注历史记录</span>
    <span class="history-tools">
      日期：<input id="datePick" type="date">
      <button onclick="loadData()">刷新</button>
    </span>
  </div>
  <div id="historyList" style="margin-top:8px">暂无记录</div>
</div>

<script>
const SB_URL="https://ftpbklczxrbalhzuozsh.supabase.co";
const SB_KEY="sb_publishable_ZjKRYyiuoQeF8HDLRs5Guw_VOY1wnwy";
const REST=SB_URL+'/rest/v1/bet_records';

const numbers = Array.from({ length: 49 }, (_, i) => (i + 1).toString().padStart(2, '0'));
const zodiacNumbers = {
    "马": ["01", "13", "25", "37", "49"],
    "蛇": ["02", "14", "26", "38"],
    "龙": ["03", "15", "27", "39"],
    "兔": ["04", "16", "28", "40"],
    "虎": ["05", "17", "29", "41"],
    "牛": ["06", "18", "30", "42"],
    "鼠": ["07", "19", "31", "43"],
    "猪": ["08", "20", "32", "44"],
    "狗": ["09", "21", "33", "45"],
    "鸡": ["10", "22", "34", "46"],
    "猴": ["11", "23", "35", "47"],
    "羊": ["12", "24", "36", "48"]
};
const colorMap = {
    "红": ["01", "02", "07", "08", "12", "13", "18", "19", "23", "24", "29", "30", "34", "35", "40", "45", "46"],
    "蓝": ["03", "04", "09", "10", "14", "15", "20", "25", "26", "31", "36", "37", "41", "42", "47", "48"],
    "绿": ["05", "06", "11", "16", "17", "21", "22", "27", "28", "32", "33", "38", "39", "43", "44", "49"]
};

function emptyBoard() {
    return Object.fromEntries(numbers.map(num => [num, 0]));
}
function formatBetAmount(value) {
    const num = Number(value);
    if (!Number.isFinite(num)) return '0';
    return parseFloat(num.toFixed(4)).toString();
}
function getColor(num) {
    if (colorMap["红"].includes(num)) return "red";
    if (colorMap["蓝"].includes(num)) return "blue";
    if (colorMap["绿"].includes(num)) return "green";
    return "";
}
function renderBoard(containerId, totalId, boardBets, titleText) {
    const container = document.getElementById(containerId);
    let totalBet = Object.values(boardBets).reduce((sum, val) => sum + val, 0);

    let profitData = numbers.map(num => {
        let winAmount = boardBets[num] * 47;
        let profit = totalBet - winAmount;
        return { num, bet: boardBets[num], profit };
    });

    // 与原下注统计页完全相同：盈亏从小到大。
    // 在总额固定时，也就是下注金额最大的号码球排最前面。
    profitData.sort((a, b) => a.profit - b.profit);

    container.innerHTML = profitData.map(({ num, bet, profit }) => {
        const zodiac = Object.entries(zodiacNumbers).find(([, nums]) => nums.includes(num))?.[0] || "";
        return `
            <div class="number-box">
                <div class="number ${getColor(num)}">${num}</div>
                <div class="zodiac">${zodiac}</div>
                <input type="text" class="amount" value="${formatBetAmount(bet)}" readonly>
                <input type="text" class="profit ${profit < 0 ? 'negative' : ''}" value="${formatBetAmount(profit)}" readonly>
            </div>
        `;
    }).join('');

    document.getElementById(totalId).textContent = titleText + formatBetAmount(totalBet);
}

function vnParts(d) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Ho_Chi_Minh', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).formatToParts(d);
  const o={};
  parts.forEach(p=>{if(p.type!=='literal')o[p.type]=p.value;});
  return o;
}
function vnDate(d=new Date()) {
  const p=vnParts(d);
  return `${p.year}-${p.month}-${p.day}`;
}
function vnTime(d) {
  const p=vnParts(d);
  return `${p.hour}:${p.minute}:${p.second}`;
}
function inWindow(row, dateStr) {
  const p=vnParts(new Date(row.created_at));
  const ds=`${p.year}-${p.month}-${p.day}`;
  const mins=Number(p.hour)*60+Number(p.minute);
  return ds===dateStr && mins>=18*60 && mins<=21*60+20;
}
function esc(s) {
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadData() {
  const status=document.getElementById('syncStatus');
  status.textContent='正在读取所有手机数据...';
  try {
    const url=REST+'?select=id,created_at,device_name,bet_type,bet_content,amount,bet_count,bet_details,is_undone&order=created_at.desc';
    const res=await fetch(url,{headers:{apikey:SB_KEY}});
    const raw=await res.text();
    if(!res.ok) throw new Error(raw || ('HTTP '+res.status));

    const dateStr=document.getElementById('datePick').value;
    const rows=JSON.parse(raw).filter(r=>inWindow(r,dateStr));

    const bets=emptyBoard();
    const hkBets=emptyBoard();

    rows.filter(r=>!r.is_undone).forEach(r=>{
      const board=r.bet_type==='香港盘'?hkBets:bets;
      if(Array.isArray(r.bet_details)) {
        r.bet_details.forEach(x=>{
          const n=String(x.num||'').padStart(2,'0');
          if(numbers.includes(n)) board[n]+=Number(x.amount||0);
        });
      }
    });

    renderBoard("numbers","totalBetDisplay",bets,"下注总数: ");
    renderBoard("hkNumbers","hkTotalBetDisplay",hkBets,"香港下注总数: ");

    const box=document.getElementById('historyList');
    if(!rows.length) {
      box.innerHTML='<div style="color:#777">暂无记录</div>';
    } else {
      box.innerHTML=rows.map(r=>{
        const details=Array.isArray(r.bet_details)
          ? r.bet_details.map(x=>`${esc(x.num)}=${formatBetAmount(x.amount)}`).join('、')
          : '旧记录无号码明细';
        return `<div class="history-item">
          <div><b>${vnTime(new Date(r.created_at))}</b>　${esc(r.device_name||'未知手机')}　${esc(r.bet_type||'')}</div>
          <div>${esc(r.bet_content||'')}</div>
          <div class="history-detail">${details}</div>
          <div class="${r.is_undone?'history-undone':''}">${r.is_undone?'已撤回':'有效'}｜金额 ${formatBetAmount(r.amount)}</div>
        </div>`;
      }).join('');
    }
    const validCount=rows.filter(r=>!r.is_undone).length;
    status.textContent=`所有手机汇总｜越南时间18:00–21:20｜有效记录 ${validCount} 笔`;
  } catch(e) {
    console.error(e);
    status.textContent='读取失败：'+String(e.message||e).slice(0,160);
  }
}

document.getElementById('datePick').value=vnDate();
renderBoard("numbers","totalBetDisplay",emptyBoard(),"下注总数: ");
renderBoard("hkNumbers","hkTotalBetDisplay",emptyBoard(),"香港下注总数: ");
loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
