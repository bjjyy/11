<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下注后台统计</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f6f8;color:#222}
.wrap{max-width:980px;margin:auto;padding:18px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,button{font-size:16px;padding:9px 12px;border:1px solid #ccc;border-radius:8px;background:#fff}
button{cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 5px #0001}
.card b{display:block;font-size:13px;color:#666;margin-bottom:7px}
.card strong{font-size:24px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:14px;vertical-align:top}
th{background:#fafafa;position:sticky;top:0}
.bad{color:#c62828} .good{color:#1a7f37}
.small{font-size:12px;color:#777}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)} table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<div class="wrap">
<h1>下注后台统计</h1>
<div class="sub">越南时间 18:00–21:20｜自动排除已撤回记录｜所有手机汇总</div>
<div class="toolbar">
  <label>日期 <input id="date" type="date"></label>
  <button id="refresh">刷新</button>
  <span id="status" class="small"></span>
</div>
<div class="cards">
  <div class="card"><b>有效总金额</b><strong id="totalAmount">0</strong></div>
  <div class="card"><b>成功下注笔数</b><strong id="totalRows">0</strong></div>
  <div class="card"><b>普通盘金额</b><strong id="normalAmount">0</strong></div>
  <div class="card"><b>香港盘金额</b><strong id="hkAmount">0</strong></div>
</div>
<div class="card" style="margin-bottom:12px">
  <b>各手机汇总</b>
  <div id="devices">暂无</div>
</div>
<table>
<thead><tr><th>越南时间</th><th>手机</th><th>盘口</th><th>原始内容</th><th>号码数</th><th>金额</th><th>状态</th></tr></thead>
<tbody id="rows"><tr><td colspan="7">正在读取…</td></tr></tbody>
</table>
</div>
<script>
const SB_URL="https://ftpbklczxrbalhzuozsh.supabase.co";
const SB_KEY="sb_publishable_ZjKRYyiuoQeF8HDLRs5Guw_VOY1wnwy";
const REST=SB_URL+'/rest/v1/bet_records';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){n=Number(n||0);return Number.isFinite(n)?parseFloat(n.toFixed(4)).toString():'0';}
function vnParts(d){
 const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);
 const o={};p.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});return o;
}
function vnDateString(d=new Date()){const p=vnParts(d);return `${p.year}-${p.month}-${p.day}`;}
function vnTimeString(d){const p=vnParts(d);return `${p.hour}:${p.minute}:${p.second}`;}
function isSelectedWindow(row,date){
 const p=vnParts(new Date(row.created_at));
 const ds=`${p.year}-${p.month}-${p.day}`;
 const mins=Number(p.hour)*60+Number(p.minute);
 return ds===date && mins>=1080 && mins<=1280;
}
async function load(){
 $('status').textContent='读取中…';
 try{
  const res=await fetch(REST+'?select=id,created_at,device_name,bet_type,bet_content,amount,bet_count,is_undone&order=created_at.desc',{headers:{apikey:SB_KEY}});
  const raw=await res.text();
  if(!res.ok) throw new Error(raw||('HTTP '+res.status));
  const all=JSON.parse(raw);
  const date=$('date').value;
  const dayRows=all.filter(r=>isSelectedWindow(r,date));
  const valid=dayRows.filter(r=>!r.is_undone);
  const total=valid.reduce((s,r)=>s+Number(r.amount||0),0);
  const normal=valid.filter(r=>r.bet_type==='普通盘').reduce((s,r)=>s+Number(r.amount||0),0);
  const hk=valid.filter(r=>r.bet_type==='香港盘').reduce((s,r)=>s+Number(r.amount||0),0);
  $('totalAmount').textContent=fmt(total);
  $('totalRows').textContent=valid.length;
  $('normalAmount').textContent=fmt(normal);
  $('hkAmount').textContent=fmt(hk);

  const dev={};
  valid.forEach(r=>{const k=r.device_name||'未知手机';if(!dev[k])dev[k]={count:0,amount:0};dev[k].count++;dev[k].amount+=Number(r.amount||0);});
  $('devices').innerHTML=Object.keys(dev).length?Object.entries(dev).map(([k,v])=>`<div>${esc(k)}：${v.count}笔｜金额 ${fmt(v.amount)}</div>`).join(''):'暂无有效记录';

  $('rows').innerHTML=dayRows.length?dayRows.map(r=>`<tr>
   <td>${esc(vnTimeString(new Date(r.created_at)))}</td>
   <td>${esc(r.device_name||'')}</td>
   <td>${esc(r.bet_type||'')}</td>
   <td>${esc(r.bet_content||'')}</td>
   <td>${esc(r.bet_count??'')}</td>
   <td>${esc(fmt(r.amount))}</td>
   <td class="${r.is_undone?'bad':'good'}">${r.is_undone?'已撤回':'有效'}</td>
  </tr>`).join(''):'<tr><td colspan="7">当天 18:00–21:20 暂无记录</td>';
  $('status').textContent=`读取成功：窗口内 ${dayRows.length} 笔，其中有效 ${valid.length} 笔`;
 }catch(e){
  console.error(e);
  $('status').textContent='读取失败：'+String(e.message||e).slice(0,160);
  $('rows').innerHTML='<tr><td colspan="7" class="bad">无法读取后台数据，请检查 Supabase 表字段和权限。</td></tr>';
 }
}
$('date').value=vnDateString();
$('refresh').addEventListener('click',load);
load();
setInterval(load,60000);
</script>
</body>
</html>
